# mini-SWE-agent config: GPT OSS 120B via Cerebras, no floop behaviors
# Cerebras inference: $0.35/M input, $0.75/M output
# 131K context, 1M TPM, 1000 RPM on paid tier
#
# Uses litellm_textbased (XML action parsing) because Cerebras doesn't
# reliably support tool/function calling. Must include full model section
# because -c replaces (not merges) config sections.

model:
  model_name: "cerebras/gpt-oss-120b"
  model_class: litellm_textbased
  model_kwargs:
    drop_params: true
    temperature: 0.0
  cost_tracking: "ignore_errors"
  action_regex: "<mswea_bash_command>(.*?)</mswea_bash_command>"
  format_error_template: |
    Format error:

    <error>
    {{error}}
    </error>

    Please always provide EXACTLY ONE action in the `<mswea_bash_command>` block, found {{actions|length}} actions.

    Please format your action in a `<mswea_bash_command>` block as shown in <response_example>.

    <response_example>
    Here are some thoughts about why you want to perform the action.

    <mswea_bash_command>ls -la</mswea_bash_command>
    </response_example>
  observation_template: |
    {% if output.exception_info -%}
    <exception>{{output.exception_info}}</exception>
    {% endif -%}
    <returncode>{{output.returncode}}</returncode>
    {% if output.output | length < 10000 -%}
    <output>
    {{ output.output -}}
    </output>
    {%- else -%}
    <warning>
    The output of your last command was too long.
    Please try a different command that produces less output.
    </warning>
    {%- set elided_chars = output.output | length - 10000 -%}
    <output_head>
    {{ output.output[:5000] }}
    </output_head>
    <elided_chars>
    {{ elided_chars }} characters elided
    </elided_chars>
    <output_tail>
    {{ output.output[-5000:] }}
    </output_tail>
    {%- endif -%}
